<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Profile Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .github-gradient {
            background: linear-gradient(135deg, #6e5494 0%, #1a1f2e 100%);
        }
        .card-shadow {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        .repo-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .repo-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .language-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="github-gradient text-white py-12 px-4">
        <div class="max-w-4xl mx-auto text-center">
            <h1 class="text-4xl md:text-5xl font-bold mb-4">GitHub Profile Explorer</h1>
            <p class="text-xl text-gray-200 mb-8">Discover GitHub users and explore their repositories</p>
            
            <div class="max-w-xl mx-auto relative">
                <div class="flex items-center">
                    <input 
                        type="text" 
                        id="usernameInput" 
                        placeholder="Enter GitHub username" 
                        class="w-full py-4 px-6 rounded-l-lg text-gray-800 focus:outline-none focus:ring-2 focus:ring-purple-500"
                    >
                    <button 
                        id="searchBtn" 
                        class="bg-purple-600 hover:bg-purple-700 text-white py-4 px-6 rounded-r-lg transition duration-200 flex items-center"
                    >
                        <i class="fas fa-search mr-2"></i> Search
                    </button>
                </div>
                <div id="errorMessage" class="text-red-300 mt-2 text-left hidden">
                    <i class="fas fa-exclamation-circle mr-2"></i>
                    <span id="errorText">User not found</span>
                </div>
            </div>
        </div>
    </div>

    <div class="max-w-6xl mx-auto px-4 py-8">
        <div id="profileSection" class="hidden fade-in">
            <div class="bg-white rounded-xl card-shadow p-6 mb-8">
                <div class="flex flex-col md:flex-row items-center md:items-start">
                    <img id="avatar" src="" alt="Avatar" class="w-32 h-32 rounded-full border-4 border-purple-100 mb-4 md:mb-0 md:mr-6">
                    <div class="flex-1 text-center md:text-left">
                        <div class="flex flex-col md:flex-row md:items-center justify-between mb-4">
                            <div>
                                <h2 id="name" class="text-2xl font-bold text-gray-800"></h2>
                                <p id="login" class="text-gray-600 text-lg"></p>
                            </div>
                            <div class="mt-4 md:mt-0">
                                <a id="profileLink" href="#" target="_blank" class="inline-flex items-center text-purple-600 hover:text-purple-800 font-medium">
                                    View on GitHub <i class="fas fa-external-link-alt ml-2"></i>
                                </a>
                            </div>
                        </div>
                        <p id="bio" class="text-gray-700 mb-4"></p>
                        <div class="flex flex-wrap justify-center md:justify-start gap-4">
                            <div class="flex items-center text-gray-700">
                                <i class="fas fa-users mr-2 text-purple-500"></i>
                                <span id="followers"></span> followers
                            </div>
                            <div class="flex items-center text-gray-700">
                                <i class="fas fa-user-plus mr-2 text-purple-500"></i>
                                <span id="following"></span> following
                            </div>
                            <div class="flex items-center text-gray-700">
                                <i class="fas fa-code-branch mr-2 text-purple-500"></i>
                                <span id="reposCount"></span> repositories
                            </div>
                            <div class="flex items-center text-gray-700">
                                <i class="fas fa-map-marker-alt mr-2 text-purple-500"></i>
                                <span id="location"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div>
                    <h3 class="text-xl font-bold text-gray-800 mb-4 flex items-center">
                        <i class="fas fa-book mr-2 text-purple-500"></i> Repositories
                    </h3>
                    <div id="reposList" class="space-y-4"></div>
                </div>
                
                <div>
                    <h3 class="text-xl font-bold text-gray-800 mb-4 flex items-center">
                        <i class="fas fa-users mr-2 text-purple-500"></i> Followers
                    </h3>
                    <div id="followersList" class="space-y-4"></div>
                </div>
            </div>
        </div>

        <div id="emptyState" class="text-center py-16">
            <div class="max-w-md mx-auto">
                <i class="fas fa-search text-6xl text-gray-300 mb-4"></i>
                <h3 class="text-2xl font-bold text-gray-700 mb-2">Search for a GitHub user</h3>
                <p class="text-gray-500">Enter a GitHub username above to explore their profile and repositories</p>
            </div>
        </div>
    </div>

    <script>
        // DOM Elements
        const usernameInput = document.getElementById('usernameInput');
        const searchBtn = document.getElementById('searchBtn');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        const profileSection = document.getElementById('profileSection');
        const emptyState = document.getElementById('emptyState');
        const avatar = document.getElementById('avatar');
        const name = document.getElementById('name');
        const login = document.getElementById('login');
        const bio = document.getElementById('bio');
        const followers = document.getElementById('followers');
        const following = document.getElementById('following');
        const reposCount = document.getElementById('reposCount');
        const location = document.getElementById('location');
        const profileLink = document.getElementById('profileLink');
        const reposList = document.getElementById('reposList');
        const followersList = document.getElementById('followersList');

        // Language colors mapping
        const languageColors = {
            JavaScript: '#f1e05a',
            Python: '#3572A5',
            Java: '#b07219',
            TypeScript: '#2b7489',
            PHP: '#4F5D95',
            C: '#555555',
            'C++': '#f34b7d',
            CSS: '#563d7c',
            HTML: '#e34c26',
            Ruby: '#701516',
            Go: '#00ADD8',
            Rust: '#dea584',
            Shell: '#89e051',
            Swift: '#ffac45',
            Kotlin: '#F18E33',
            Dart: '#00B4AB',
            Vue: '#2c3e50',
            React: '#61dafb',
            'C#': '#178600',
            Scala: '#c22d40',
            Perl: '#0298c3',
            Lua: '#000080',
            R: '#198CE7',
            'Objective-C': '#438eff',
            'Jupyter Notebook': '#DA5B0B',
            TeX: '#3D6117',
            Haskell: '#5e5086',
            PowerShell: '#012456',
            MATLAB: '#e16737'
        };

        // Get user data from GitHub API
        function getUser(username) {
            return new Promise((resolve, reject) => {
                fetch(`https://api.github.com/users/${username}`)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('User not found');
                        }
                        return response.json();
                    })
                    .then(data => resolve(data))
                    .catch(error => reject(error));
            });
        }

        // Get user repositories
        function getUserRepos(username) {
            return fetch(`https://api.github.com/users/${username}/repos?sort=updated&per_page=10`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Failed to fetch repositories');
                    }
                    return response.json();
                });
        }

        // Get user followers
        function getUserFollowers(username) {
            return fetch(`https://api.github.com/users/${username}/followers?per_page=10`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Failed to fetch followers');
                    }
                    return response.json();
                });
        }

        // Format numbers with commas
        function formatNumber(num) {
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }

        // Format date
        function formatDate(dateString) {
            const options = { year: 'numeric', month: 'short', day: 'numeric' };
            return new Date(dateString).toLocaleDateString(undefined, options);
        }

        // Get color for programming language
        function getLanguageColor(language) {
            return languageColors[language] || '#6c757d';
        }

        // Display user profile
        function displayUserProfile(userData) {
            avatar.src = userData.avatar_url;
            name.textContent = userData.name || userData.login;
            login.textContent = `@${userData.login}`;
            bio.textContent = userData.bio || 'No bio available';
            followers.textContent = formatNumber(userData.followers);
            following.textContent = formatNumber(userData.following);
            reposCount.textContent = formatNumber(userData.public_repos);
            location.textContent = userData.location || 'Not specified';
            profileLink.href = userData.html_url;
        }

        // Display repositories
        function displayRepositories(repos) {
            if (repos.length === 0) {
                reposList.innerHTML = '<p class="text-gray-500 text-center py-4">No repositories found</p>';
                return;
            }

            reposList.innerHTML = repos.map(repo => `
                <div class="repo-card bg-white rounded-lg card-shadow p-4 border-l-4 border-purple-500">
                    <div class="flex justify-between items-start mb-2">
                        <h4 class="font-bold text-lg text-gray-800 truncate">
                            <a href="${repo.html_url}" target="_blank" class="hover:text-purple-600">${repo.name}</a>
                        </h4>
                        <div class="flex items-center text-gray-600">
                            <i class="fas fa-star mr-1 text-yellow-500"></i>
                            <span>${formatNumber(repo.stargazers_count)}</span>
                        </div>
                    </div>
                    <p class="text-gray-600 text-sm mb-3 line-clamp-2">${repo.description || 'No description available'}</p>
                    <div class="flex justify-between items-center">
                        <div class="flex items-center">
                            ${repo.language ? `
                                <span class="language-color" style="background-color: ${getLanguageColor(repo.language)}"></span>
                                <span class="text-sm text-gray-600">${repo.language}</span>
                            ` : ''}
                        </div>
                        <div class="text-sm text-gray-500">
                            Updated ${formatDate(repo.updated_at)}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Display followers
        function displayFollowers(followers) {
            if (followers.length === 0) {
                followersList.innerHTML = '<p class="text-gray-500 text-center py-4">No followers found</p>';
                return;
            }

            followersList.innerHTML = followers.map(follower => `
                <div class="bg-white rounded-lg card-shadow p-4 flex items-center">
                    <img src="${follower.avatar_url}" alt="${follower.login}" class="w-12 h-12 rounded-full mr-4">
                    <div class="flex-1">
                        <h4 class="font-bold text-gray-800">${follower.login}</h4>
                        <a href="${follower.html_url}" target="_blank" class="text-sm text-purple-600 hover:text-purple-800">View Profile</a>
                    </div>
                </div>
            `).join('');
        }

        // Show error message
        function showError(message) {
            errorText.textContent = message;
            errorMessage.classList.remove('hidden');
            profileSection.classList.add('hidden');
            emptyState.classList.remove('hidden');
        }

        // Hide error message
        function hideError() {
            errorMessage.classList.add('hidden');
        }

        // Save to localStorage
        function saveToLocalStorage(username, data) {
            const cache = {
                data,
                timestamp: Date.now()
            };
            localStorage.setItem(`github_user_${username}`, JSON.stringify(cache));
        }

        // Get from localStorage
        function getFromLocalStorage(username) {
            const cached = localStorage.getItem(`github_user_${username}`);
            if (!cached) return null;
            
            const { data, timestamp } = JSON.parse(cached);
            const isExpired = Date.now() - timestamp > 5 * 60 * 1000; // 5 minutes
            
            return isExpired ? null : data;
        }

        // Search user
        async function searchUser() {
            const username = usernameInput.value.trim();
            
            if (!username) {
                showError('Please enter a username');
                return;
            }
            
            hideError();
            searchBtn.disabled = true;
            searchBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Searching...';
            
            try {
                // Check cache first
                const cachedData = getFromLocalStorage(username);
                
                if (cachedData) {
                    // Use cached data
                    displayUserProfile(cachedData.user);
                    displayRepositories(cachedData.repos);
                    displayFollowers(cachedData.followers);
                    
                    profileSection.classList.remove('hidden');
                    emptyState.classList.add('hidden');
                } else {
                    // Fetch fresh data
                    const userData = await getUser(username);
                    
                    // Fetch repos and followers in parallel
                    const [repos, followers] = await Promise.all([
                        getUserRepos(username),
                        getUserFollowers(username)
                    ]);
                    
                    // Save to cache
                    saveToLocalStorage(username, {
                        user: userData,
                        repos,
                        followers
                    });
                    
                    // Display data
                    displayUserProfile(userData);
                    displayRepositories(repos);
                    displayFollowers(followers);
                    
                    profileSection.classList.remove('hidden');
                    emptyState.classList.add('hidden');
                }
            } catch (error) {
                showError(error.message);
            } finally {
                searchBtn.disabled = false;
                searchBtn.innerHTML = '<i class="fas fa-search mr-2"></i> Search';
            }
        }

        // Event Listeners
        searchBtn.addEventListener('click', searchUser);
        
        usernameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                searchUser();
            }
        });

        // Load last searched user from localStorage on page load
        window.addEventListener('DOMContentLoaded', () => {
            const lastSearched = localStorage.getItem('last_searched_user');
            if (lastSearched) {
                usernameInput.value = lastSearched;
                searchUser();
            }
        });
    </script>
</body>
</html>
