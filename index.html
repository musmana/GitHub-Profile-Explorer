<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Profile Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loading {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-900 via-purple-900 to-gray-900 min-h-screen text-white">
    <div class="container mx-auto px-4 py-8 max-w-6xl">
        <h1 class="text-4xl font-bold text-center mb-8 bg-gradient-to-r from-purple-400 to-pink-400 bg-clip-text text-transparent">
            GitHub Profile Explorer
        </h1>

        <!-- Search Section -->
        <div class="bg-gray-800 rounded-lg shadow-xl p-6 mb-8">
            <div class="flex gap-3">
                <input 
                    type="text" 
                    id="usernameInput" 
                    placeholder="Enter GitHub username (e.g., torvalds, gaearon)..."
                    class="flex-1 px-4 py-3 bg-gray-700 text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500"
                    onkeypress="if(event.key === 'Enter') searchUser()"
                >
                <button 
                    onclick="searchUser()"
                    class="px-6 py-3 bg-gradient-to-r from-purple-500 to-pink-500 rounded-lg font-semibold hover:from-purple-600 hover:to-pink-600 transition-all transform hover:scale-105"
                >
                    Search
                </button>
            </div>
        </div>

        <!-- Loading State -->
        <div id="loadingState" class="hidden flex justify-center items-center py-20">
            <div class="loading"></div>
        </div>

        <!-- Error Message -->
        <div id="errorMessage" class="hidden bg-red-500 bg-opacity-20 border border-red-500 rounded-lg p-4 mb-8 text-center">
            <p class="text-red-300 font-semibold"></p>
        </div>

        <!-- Profile Section -->
        <div id="profileSection" class="hidden">
            <!-- User Profile Card -->
            <div class="bg-gray-800 rounded-lg shadow-xl p-6 mb-8">
                <div class="flex flex-col md:flex-row gap-6 items-center md:items-start">
                    <img 
                        id="userAvatar" 
                        class="w-32 h-32 rounded-full border-4 border-purple-500 shadow-lg"
                        alt="User Avatar"
                    >
                    <div class="flex-1 text-center md:text-left">
                        <h2 id="userName" class="text-3xl font-bold mb-2"></h2>
                        <p id="userLogin" class="text-gray-400 mb-3"></p>
                        <p id="userBio" class="text-gray-300 mb-4"></p>
                        <div class="flex flex-wrap gap-4 justify-center md:justify-start">
                            <div class="bg-gray-700 px-4 py-2 rounded-lg">
                                <p class="text-sm text-gray-400">Followers</p>
                                <p id="userFollowers" class="text-xl font-bold text-purple-400"></p>
                            </div>
                            <div class="bg-gray-700 px-4 py-2 rounded-lg">
                                <p class="text-sm text-gray-400">Following</p>
                                <p id="userFollowing" class="text-xl font-bold text-purple-400"></p>
                            </div>
                            <div class="bg-gray-700 px-4 py-2 rounded-lg">
                                <p class="text-sm text-gray-400">Public Repos</p>
                                <p id="userRepos" class="text-xl font-bold text-purple-400"></p>
                            </div>
                        </div>
                        <a id="profileLink" target="_blank" class="inline-block mt-4 px-6 py-2 bg-gray-700 rounded-lg hover:bg-gray-600 transition-colors">
                            View on GitHub →
                        </a>
                    </div>
                </div>
            </div>

            <!-- Repositories Section -->
            <div class="bg-gray-800 rounded-lg shadow-xl p-6">
                <h3 class="text-2xl font-bold mb-6 text-purple-400">Popular Repositories</h3>
                <div id="reposList" class="grid gap-4"></div>
            </div>
        </div>
    </div>

    <script>
        // In-memory cache instead of localStorage
        let profileCache = {};

        // Function to get user profile - returns a Promise
        function getUser(username) {
            return new Promise((resolve, reject) => {
                fetch(`https://api.github.com/users/${username}`, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/vnd.github.v3+json'
                    }
                })
                .then(response => {
                    if (!response.ok) {
                        if (response.status === 404) {
                            throw new Error('User not found. Please check the username and try again.');
                        } else if (response.status === 403) {
                            throw new Error('API rate limit exceeded. Please try again later.');
                        } else {
                            throw new Error(`Failed to fetch user data (Status: ${response.status})`);
                        }
                    }
                    return response.json();
                })
                .then(data => resolve(data))
                .catch(error => reject(error));
            });
        }

        // Function to get user repos
        function getUserRepos(username) {
            return fetch(`https://api.github.com/users/${username}/repos?sort=stars&per_page=10`, {
                method: 'GET',
                headers: {
                    'Accept': 'application/vnd.github.v3+json'
                }
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Failed to fetch repositories');
                }
                return response.json();
            });
        }

        // Function to get user followers
        function getUserFollowers(username) {
            return fetch(`https://api.github.com/users/${username}/followers?per_page=1`, {
                method: 'GET',
                headers: {
                    'Accept': 'application/vnd.github.v3+json'
                }
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Failed to fetch followers');
                }
                return response.json();
            });
        }

        // Main async function to search and display user
        async function searchUser() {
            const username = document.getElementById('usernameInput').value.trim();
            
            if (!username) {
                showError('Please enter a username');
                return;
            }

            // Check cache first
            if (profileCache[username]) {
                displayProfile(profileCache[username]);
                return;
            }

            showLoading();
            hideError();
            hideProfile();

            try {
                // First, fetch user profile using the Promise-based function
                const userProfile = await getUser(username);

                // Then fetch repos and followers in parallel using Promise.all()
                const [repos, followers] = await Promise.all([
                    getUserRepos(username),
                    getUserFollowers(username)
                ]);

                const profileData = {
                    user: userProfile,
                    repos: repos,
                    followers: followers
                };

                // Cache the result in memory
                profileCache[username] = profileData;

                hideLoading();
                displayProfile(profileData);

            } catch (error) {
                hideLoading();
                console.error('Error details:', error);
                showError(error.message || 'An error occurred while fetching data. Please try again.');
            }
        }

        // Display profile function
        function displayProfile(data) {
            const { user, repos } = data;

            document.getElementById('userAvatar').src = user.avatar_url;
            document.getElementById('userName').textContent = user.name || user.login;
            document.getElementById('userLogin').textContent = `@${user.login}`;
            document.getElementById('userBio').textContent = user.bio || 'No bio available';
            document.getElementById('userFollowers').textContent = user.followers;
            document.getElementById('userFollowing').textContent = user.following;
            document.getElementById('userRepos').textContent = user.public_repos;
            document.getElementById('profileLink').href = user.html_url;

            // Display repositories
            const reposList = document.getElementById('reposList');
            reposList.innerHTML = '';

            if (repos.length === 0) {
                reposList.innerHTML = '<p class="text-gray-400">No public repositories found</p>';
            } else {
                repos.forEach(repo => {
                    const repoCard = document.createElement('div');
                    repoCard.className = 'bg-gray-700 rounded-lg p-4 hover:bg-gray-600 transition-colors';
                    repoCard.innerHTML = `
                        <div class="flex justify-between items-start mb-2">
                            <a href="${repo.html_url}" target="_blank" class="text-lg font-semibold text-purple-300 hover:text-purple-400">
                                ${repo.name}
                            </a>
                            <div class="flex gap-3 text-sm text-gray-400">
                                <span>⭐ ${repo.stargazers_count}</span>
                                <span>🔀 ${repo.forks_count}</span>
                            </div>
                        </div>
                        <p class="text-gray-300 text-sm mb-2">${repo.description || 'No description'}</p>
                        ${repo.language ? `<span class="inline-block px-3 py-1 bg-purple-600 rounded-full text-xs">${repo.language}</span>` : ''}
                    `;
                    reposList.appendChild(repoCard);
                });
            }

            showProfile();
        }

        // UI helper functions
        function showLoading() {
            document.getElementById('loadingState').classList.remove('hidden');
        }

        function hideLoading() {
            document.getElementById('loadingState').classList.add('hidden');
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.querySelector('p').textContent = message;
            errorDiv.classList.remove('hidden');
        }

        function hideError() {
            document.getElementById('errorMessage').classList.add('hidden');
        }

        function showProfile() {
            document.getElementById('profileSection').classList.remove('hidden');
        }

        function hideProfile() {
            document.getElementById('profileSection').classList.add('hidden');
        }

        // Load cached profile on page load (if any)
        window.addEventListener('DOMContentLoaded', () => {
            // Since we're using in-memory cache, nothing persists on page reload
            // This is intentional to comply with the storage restriction
            console.log('GitHub Profile Explorer ready!');
        });
    </script>
</body>
</html>
